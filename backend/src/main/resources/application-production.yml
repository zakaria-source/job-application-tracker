spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}?sslmode=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000

server:
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript

jobtrackr:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${REFRESH_TTL:P30D}
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    secure-cookies: ${COOKIE_SECURE:true}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:}
    frontend-base-url: ${GMAIL_FRONTEND_BASE_URL:}
    token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    sync-delay-ms: ${GMAIL_SYNC_DELAY_MS:900000}
    initial-lookback-days: ${GMAIL_INITIAL_LOOKBACK_DAYS:30}
    auto-apply-min-match: ${GMAIL_AUTO_APPLY_MIN_MATCH:70}
    auto-apply-min-confidence: ${GMAIL_AUTO_APPLY_MIN_CONFIDENCE:80}
