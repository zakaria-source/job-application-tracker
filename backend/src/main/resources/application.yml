spring:
  application:
    name: jobtrackr-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobtrackr}
    username: ${DATABASE_USERNAME:jobtrackr}
    password: ${DATABASE_PASSWORD:jobtrackr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    dev.jobtrackr: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jobtrackr:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-0123456789abcdef}
    token-ttl: ${JWT_TTL:PT12H}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
    secure-cookies: ${COOKIE_SECURE:false}
