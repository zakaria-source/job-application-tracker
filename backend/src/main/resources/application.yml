spring:
  application:
    name: jobtrackr-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobtrackr}
    username: ${DATABASE_USERNAME:jobtrackr}
    password: ${DATABASE_PASSWORD:jobtrackr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    dev.jobtrackr: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jobtrackr:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-0123456789abcdef}
    token-ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${REFRESH_TTL:P30D}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
    secure-cookies: ${COOKIE_SECURE:false}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/gmail/oauth/callback}
    frontend-base-url: ${GMAIL_FRONTEND_BASE_URL:http://localhost:4200}
    token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    sync-delay-ms: ${GMAIL_SYNC_DELAY_MS:900000}
    initial-lookback-days: ${GMAIL_INITIAL_LOOKBACK_DAYS:30}
    auto-apply-min-match: ${GMAIL_AUTO_APPLY_MIN_MATCH:70}
    auto-apply-min-confidence: ${GMAIL_AUTO_APPLY_MIN_CONFIDENCE:80}
