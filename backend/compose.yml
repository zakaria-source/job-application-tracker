services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtrackr
      POSTGRES_USER: jobtrackr
      POSTGRES_PASSWORD: jobtrackr
    ports:
      - "5432:5432"
    volumes:
      - jobtrackr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrackr -d jobtrackr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobtrackr-postgres:
