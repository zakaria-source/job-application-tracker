name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm run test:ci

      - name: Build Netlify application
        env:
          JOBTRACKR_API_ORIGIN: https://api.example.com
        run: npm run build:netlify

      - name: Verify Netlify routing
        run: |
          grep -F '/api/*  https://api.example.com/api/:splat  200' dist/demo/browser/_redirects
          grep -F '/*  /index.html  200' dist/demo/browser/_redirects

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        run: mvn -B -f backend/pom.xml verify

      - name: Build production Docker image
        run: docker build -t jobtrackr-api-ci backend
