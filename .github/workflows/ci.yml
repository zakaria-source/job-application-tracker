name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Enforce browser auth boundary
        working-directory: frontend
        run: |
          if grep -R -n -E 'accessToken|sessionStorage|Authorization.*Bearer' src/app/core/auth; then
            echo 'Browser auth code must not read, persist, or attach bearer credentials.'
            exit 1
          fi
          grep -F 'withCredentials: true' src/app/core/auth/auth.interceptor.ts
          grep -F "withXsrfConfiguration({cookieName: 'XSRF-TOKEN', headerName: 'X-XSRF-TOKEN'})" src/main.ts

      - name: Build Netlify application
        working-directory: frontend
        env:
          JOBTRACKR_API_ORIGIN: https://api.example.com
        run: npm run build:netlify

      - name: Verify Netlify routing
        working-directory: frontend
        run: |
          grep -F '/api/*  https://api.example.com/api/:splat  200' dist/demo/browser/_redirects
          grep -F '/*  /index.html  200' dist/demo/browser/_redirects

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        run: mvn -B -f backend/pom.xml verify

      - name: Build production Docker image
        run: docker build -t jobtrackr-api-ci backend

      - name: Verify free Render + Neon blueprint
        run: |
          grep -F '    plan: free' render.yaml
          grep -F '      - key: DATABASE_HOST' render.yaml
          grep -F '        sync: false' render.yaml
          grep -F '        value: PT15M' render.yaml
          grep -F '        value: P30D' render.yaml
          if grep -q '^databases:' render.yaml; then
            echo 'Render-managed database must not be provisioned in the free Neon baseline.'
            exit 1
          fi
