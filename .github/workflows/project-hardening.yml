name: Project hardening

on:
  push:
    branches:
      - agent/fix-project-audit

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-project-audit

      - name: Apply audited fixes
        run: python3 scripts/apply-project-hardening.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vitest toolchain
        run: npm install --save-dev vitest jsdom @vitest/coverage-v8

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm run test:ci

      - name: Build application
        run: npm run build -- --configuration production

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json package-lock.json angular.json tsconfig.spec.json
          git commit -m "refactor: harden application architecture and quality"
          git push origin HEAD:agent/fix-project-audit
