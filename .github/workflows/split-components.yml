name: Split component files

on:
  push:
    branches:
      - agent/split-component-files

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-component-files

      - name: Split inline templates and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          files = [
              Path('src/app/app.component.ts'),
              Path('src/app/components/dashboard/dashboard.component.ts'),
              Path('src/app/components/job-list/job-list.component.ts'),
              Path('src/app/components/job-form/job-form.component.ts'),
          ]

          pattern = re.compile(
              r"template:\s*`(?P<html>[\s\S]*?)`,\s*styles:\s*\[\s*`(?P<css>[\s\S]*?)`\s*\]",
              re.MULTILINE,
          )

          for ts_path in files:
              source = ts_path.read_text(encoding='utf-8')
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f'Inline template/styles not found in {ts_path}')

              html = textwrap.dedent(match.group('html')).strip('\n') + '\n'
              css = textwrap.dedent(match.group('css')).strip('\n') + '\n'

              base = ts_path.name.removesuffix('.ts')
              html_path = ts_path.with_name(f'{base}.html')
              css_path = ts_path.with_name(f'{base}.css')

              html_path.write_text(html, encoding='utf-8')
              css_path.write_text(css, encoding='utf-8')

              replacement = (
                  f"templateUrl: './{base}.html',\n"
                  f"    styleUrl: './{base}.css'"
              )
              updated = source[:match.start()] + replacement + source[match.end():]
              ts_path.write_text(updated, encoding='utf-8')

              print(f'Split {ts_path} -> {html_path.name}, {css_path.name}')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build application
        run: npm run build -- --configuration production

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/app.component.ts src/app/app.component.html src/app/app.component.css \
            src/app/components/dashboard/dashboard.component.ts src/app/components/dashboard/dashboard.component.html src/app/components/dashboard/dashboard.component.css \
            src/app/components/job-list/job-list.component.ts src/app/components/job-list/job-list.component.html src/app/components/job-list/job-list.component.css \
            src/app/components/job-form/job-form.component.ts src/app/components/job-form/job-form.component.html src/app/components/job-form/job-form.component.css
          git commit -m "refactor: separate component templates and styles"
          git push origin HEAD:agent/split-component-files
