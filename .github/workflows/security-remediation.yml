name: Publish validated Angular security migration

on:
  push:
    branches:
      - agent/dependency-security-audit

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade Angular 19 to Angular 20
        run: npx ng update @angular/core@20 @angular/cli@20 @angular/material@20 --allow-dirty

      - name: Upgrade Angular 20 to Angular 21
        run: npx ng update @angular/core@21 @angular/cli@21 @angular/material@21 --allow-dirty

      - name: Align CDK and chart dependencies with Angular 21
        run: npm install @angular/cdk@21.2.14 ng2-charts@10.0.0 chart.js@latest

      - name: Migrate ng2-charts standalone API
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const dashboardPath = 'src/app/components/dashboard/dashboard.component.ts';
          let dashboard = fs.readFileSync(dashboardPath, 'utf8');
          dashboard = dashboard.replace(
            "import {NgChartsModule} from 'ng2-charts';",
            "import {BaseChartDirective} from 'ng2-charts';"
          );
          dashboard = dashboard.replace(/\bNgChartsModule\b/g, 'BaseChartDirective');
          fs.writeFileSync(dashboardPath, dashboard);

          const mainPath = 'src/main.ts';
          fs.writeFileSync(mainPath, `import {provideZoneChangeDetection} from '@angular/core';
import {bootstrapApplication} from '@angular/platform-browser';
import {provideAnimations} from '@angular/platform-browser/animations';
import {provideCharts, withDefaultRegisterables} from 'ng2-charts';
import {App} from './app/app.component';

bootstrapApplication(App, {
    providers: [
        provideCharts(withDefaultRegisterables()),
        provideZoneChangeDetection(),
        provideAnimations()
    ]
}).catch(err => console.error(err));
`);
          NODE

      - name: Reinstall from migrated lockfile
        run: npm ci

      - name: Validate production build
        run: npm run build -- --configuration production

      - name: Require clean production dependency audit
        run: npm audit --omit=dev

      - name: Report full dependency audit
        run: npm audit || true

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json angular.json tsconfig.json src/main.ts \
            src/app/components/dashboard/dashboard.component.ts \
            src/app/components/job-form/job-form.component.ts \
            src/app/components/job-list/job-list.component.ts
          git status --short
          git diff --cached --stat
          git commit -m "chore: upgrade Angular dependencies securely"
          git push origin HEAD:agent/dependency-security-audit
