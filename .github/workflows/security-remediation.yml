name: Angular security migration rehearsal

on:
  push:
    branches:
      - agent/dependency-security-audit

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade Angular 19 to Angular 20
        run: npx ng update @angular/core@20 @angular/cli@20 @angular/material@20 --allow-dirty

      - name: Upgrade Angular 20 to Angular 21
        run: npx ng update @angular/core@21 @angular/cli@21 @angular/material@21 --allow-dirty

      - name: Align CDK and chart dependencies with Angular 21
        run: npm install @angular/cdk@21.2.14 ng2-charts@10.0.0 chart.js@latest

      - name: Reinstall from migrated lockfile
        run: npm ci

      - name: Validate production build
        run: npm run build -- --configuration production

      - name: Capture full audit
        run: npm audit --json > audit-full.json || true

      - name: Capture production audit
        run: npm audit --omit=dev --json > audit-production.json || true

      - name: Summarize audit and migration diff
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-full.json', 'audit-production.json']) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`=== ${file} ===`);
            console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, vulnerability] of Object.entries(audit.vulnerabilities ?? {})) {
              if (vulnerability.isDirect || ['critical', 'high'].includes(vulnerability.severity)) {
                console.log(JSON.stringify({
                  name,
                  severity: vulnerability.severity,
                  isDirect: vulnerability.isDirect,
                  range: vulnerability.range,
                  fixAvailable: vulnerability.fixAvailable
                }));
              }
            }
          }
          NODE
          git status --short
          git diff --stat

      - name: Upload migrated workspace files
        uses: actions/upload-artifact@v4
        with:
          name: angular-security-migration
          path: |
            package.json
            package-lock.json
            angular.json
            tsconfig.json
            src
            audit-full.json
            audit-production.json
          retention-days: 1
