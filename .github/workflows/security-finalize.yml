name: Finalize non-breaking dependency fixes

on:
  push:
    branches:
      - agent/dependency-security-audit

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install migrated dependency tree
        run: npm ci

      - name: Apply only non-breaking audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Reinstall fixed lockfile
        run: npm ci

      - name: Validate production build
        run: npm run build -- --configuration production

      - name: Require zero production vulnerabilities
        run: npm audit --omit=dev

      - name: Report remaining development audit
        run: npm audit || true

      - name: Commit lockfile fixes
        run: |
          if git diff --quiet package-lock.json; then
            echo "No additional non-breaking lockfile fixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply non-breaking dependency fixes"
          git push origin HEAD:agent/dependency-security-audit
