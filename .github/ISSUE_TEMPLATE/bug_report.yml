name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve JobTrackr. Do not include passwords, OAuth tokens, JWTs, recruiter emails, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend API
        - Authentication / sessions
        - Gmail synchronization
        - Deployment / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, browser/runtime details, or request IDs when useful.
