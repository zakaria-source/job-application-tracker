<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" [routerLink]="cloudConnected ? '/dashboard' : '/account'" aria-label="JobTrackr">
        <span class="brand-monogram">JT</span>
        <strong>JobTrackr</strong>
      </a>

      @if (cloudConnected && !isOnboarding) {
        <nav class="topbar-nav" aria-label="Navigation principale">
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Vue d’ensemble</a>
          <a routerLink="/applications" routerLinkActive="active">Candidatures</a>
        </nav>
      }

      <a
        class="account-link"
        routerLink="/account"
        routerLinkActive="active"
        [attr.aria-label]="cloudConnected ? 'Ouvrir le compte' : 'Se connecter'">
        @if (cloudConnected) {
          <span class="avatar">{{ accountInitials }}</span>
        } @else {
          <span>Connexion</span>
          <mat-icon>arrow_forward</mat-icon>
        }
      </a>
    </div>
  </header>

  <main class="workspace" [class.onboarding-workspace]="isOnboarding">
    @if (!isOnboarding) {
      <section class="page-heading">
        <span class="page-kicker">JOBTRACKR</span>
        <h1>{{ pageTitle }}</h1>
      </section>
    }

    <div class="route-content" [class.onboarding-content]="isOnboarding">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
