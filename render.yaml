services:
  - type: web
    name: jobtrackr-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: PT15M
      - key: REFRESH_TTL
        value: P30D
      - key: CORS_ALLOWED_ORIGINS
        value: https://trackmyjob-zakaria.netlify.app
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GMAIL_REDIRECT_URI
        value: https://trackmyjob-zakaria.netlify.app/api/v1/gmail/oauth/callback
      - key: GMAIL_FRONTEND_BASE_URL
        value: https://trackmyjob-zakaria.netlify.app
      - key: GMAIL_SYNC_DELAY_MS
        value: "900000"
      - key: GMAIL_INITIAL_LOOKBACK_DAYS
        value: "30"
      - key: GMAIL_AUTO_APPLY_MIN_MATCH
        value: "70"
      - key: GMAIL_AUTO_APPLY_MIN_CONFIDENCE
        value: "80"
