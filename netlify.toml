[build]
  base = "frontend"
  command = "npm run build:netlify"
  publish = "dist/demo/browser"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
